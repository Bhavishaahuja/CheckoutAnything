<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d3fd0" />
    <title>Checkout Anything</title>
    <script>
      // set the theme before first paint so there is no flash, the same way as the Checkout
      // Anything app (same "theme" key). ?theme=dark|light comes from that app's review drawer,
      // so the confirm page in the drawer follows the app around it. it isn't saved
      try {
        var asked = new URLSearchParams(window.location.search).get("theme");
        var saved = localStorage.getItem("theme");
        var dark;
        if (asked === "dark" || asked === "light") dark = asked === "dark";
        else if (saved) dark = saved === "dark";
        else dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
