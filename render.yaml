# Render Blueprint for Checkout Anything. Spec: https://render.com/docs/blueprint-spec
# One product, two backends: the Connect service (its own database and three services) and
# the Check service (API and frontend, built from check/, on the leash-db database that already
# exists and keeps its old name).

databases:
  - name: checkout-anything-db
    region: oregon
    # a free Render Postgres is deleted 30 days after it's created, which is before the
    # judging window ends (Dec 15). so this is the smallest paid plan
    plan: basic-256mb

services:
  - type: web
    name: checkout-anything-api
    runtime: python
    # paid instances never spin down, so judges don't wait a minute for the first request
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # the Agent Toolkit goes in with --no-deps: it pins old openai-agents, langchain and
    # crewai-tools versions that this app never imports
    buildCommand: pip install -r requirements.txt && pip install --no-deps paypal-agent-toolkit
    # one process on purpose. the live event log of a connect run is kept in memory, a second
    # worker wouldn't see it
    startCommand: uvicorn backend.app.main:app_factory --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: checkout-anything-db
          property: connectionString
      # sync: false means Render asks for the value in the dashboard and never reads it
      # from this file
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: BUYER_VAULT_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # the frontend's URL, like https://checkout-anything.onrender.com
      - key: FRONTEND_ORIGINS
        sync: false
      # the demo stores' URL, like https://checkout-anything-stores.onrender.com
      - key: DEMO_STORES_BASE_URL
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DEMO_MODE
        value: live
      # Check. CHECK_URL is the switch: leave it empty and agent orders are paid and captured
      # here, as before. set it to the check-api service's URL to send them through Check.
      # the keys are check-api's own (one of its AGENT_API_KEYS, and its MERCHANT_API_KEY)
      - key: CHECK_URL
        sync: false
      - key: CHECK_AGENT_KEY
        sync: false
      - key: CHECK_MERCHANT_KEY
        sync: false
      # the check-frontend service's URL, for the buyer's confirm page
      - key: CHECK_FRONTEND_URL
        sync: false

  # the app itself. a static site lives on Render's CDN, so no region or plan
  - type: web
    name: checkout-anything
    runtime: static
    branch: main
    autoDeployTrigger: commit
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Vite bakes this into the bundle at build time, so changing it needs a rebuild.
      # not a secret, it ends up in the public JS anyway
      - key: VITE_API_URL
        sync: false

  # the three fictional demo stores, plain HTML with no build step
  - type: web
    name: checkout-anything-stores
    runtime: static
    branch: main
    autoDeployTrigger: commit
    rootDir: demo-stores
    buildCommand: echo "nothing to build"
    staticPublishPath: .

  # ---- Check and Defend (check/, settings copied from check/render.yaml) ----
  #
  # Its Postgres (leash-db, Oregon, paid plan) already exists and isn't declared here.
  # Paste its Internal Database URL into DATABASE_URL in the dashboard.
  - type: web
    name: check-api
    runtime: python
    # the $7/month instance. paid instances never spin down. this has to match the dashboard,
    # or a Blueprint sync puts the service back on the free plan
    plan: 0.5c-512mb
    # same region as leash-db so the internal database URL works
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # build and start both run from here, so backend.app below is the Check service's package
    rootDir: check
    buildCommand: pip install -r requirements.txt
    # migrations run right before uvicorn starts. if one fails, uvicorn never starts and the
    # deploy fails its health check
    startCommand: alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AGENT_API_KEYS
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: MERCHANT_API_KEY
        sync: false
      # the name CHECK_AGENT_KEY has in AGENT_API_KEYS, so the Connect service may say which
      # store an order was placed at
      - key: STORE_NAMING_AGENTS
        sync: false
      - key: DEMO_MERCHANT_PASSWORD
        sync: false
      - key: DEMO_VAULT_ID
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com

  # the Check dashboard and the buyer's confirm page
  - type: web
    name: check-frontend
    runtime: static
    branch: main
    autoDeployTrigger: commit
    rootDir: check/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # the URL of the check-api service above. set in the dashboard, not here: the service
      # created from this file gets a new URL, and a value written here would be put back on
      # every Blueprint sync. Vite bakes it in at build time, so changing it needs a rebuild
      - key: VITE_API_URL
        sync: false
      - key: VITE_USE_MOCKS
        value: "false"
      # the checkout-anything site's URL. the confirm page reports a finished decision to this
      # origin and no other (the review drawer in the Orders grid listens for it)
      - key: VITE_CONNECT_URL
        sync: false
      # AG Grid Enterprise trial key. set it in the dashboard, never in git
      - key: VITE_AG_GRID_LICENSE_KEY
        sync: false
    headers:
      # who may show this site in an iframe: itself and the checkout-anything site, whose review
      # drawer frames the confirm page. a static site can't read an env var here, so if the
      # checkout-anything service has a different URL, change it on this line too
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'self' https://checkout-anything.onrender.com
    routes:
      # single-page app: /dashboard and /confirm/<token> only exist in the browser, so every
      # path that isn't a real file serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
