name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # the same two installs as the buildCommand in render.yaml
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --no-deps paypal-agent-toolkit

      # before the dev requirements go in, so this sees only what the hosted API has.
      # requirements-dev.txt lists httpx too, and that would hide a gap in requirements.txt
      - name: Agent Toolkit imports with the hosted API's packages
        run: python -c "from paypal_agent_toolkit.shared.api import PayPalAPI; from paypal_agent_toolkit.shared.configuration import Context"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      # no network: PayPal and Claude are faked. the live sandbox test is behind a marker
      - name: Pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # both apps wear the same header. the component and its stylesheet are kept as two
      # identical copies, and this is what keeps them identical
      - name: Shared header is the same in both apps
        run: |
          diff frontend/src/components/AppHeader.tsx check/frontend/src/components/AppHeader.tsx
          diff frontend/src/components/app-header.css check/frontend/src/components/app-header.css
          diff frontend/src/components/BrandMark.tsx check/frontend/src/components/BrandMark.tsx

      - name: Install
        working-directory: frontend
        run: npm ci

      # tsc runs as part of the build
      - name: Build
        working-directory: frontend
        run: npm run build

  # Check and Defend (the intent check, review and disputes service) live in check/ (git subtree)
  # and keep their own requirements, pyproject and tests.
  # GitHub only reads workflows from the root .github/, so its jobs are declared here
  check-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            check/requirements.txt
            check/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      # a plain pytest skips these because they start a real server
      - name: Pytest (real server)
        run: pytest -m real_server

  check-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: check/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: check/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
